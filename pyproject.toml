[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-flight-recorder"
version = "0.1.0b1"
description = "Local Windows recorder for GPU/display freezes and driver-path stalls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Alex Jardine" }
]
keywords = [
  "diagnostics",
  "display",
  "freeze",
  "gpu",
  "nvidia",
  "windows"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Hardware",
  "Topic :: System :: Monitoring"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Krmzyn/gpu-flight-recorder"
Repository = "https://github.com/Krmzyn/gpu-flight-recorder"
Issues = "https://github.com/Krmzyn/gpu-flight-recorder/issues"

[project.scripts]
gpu-flight-recorder = "gpu_flight_recorder.__main__:main"

[tool.setuptools.packages.find]
include = ["gpu_flight_recorder*"]
